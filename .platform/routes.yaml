https://{default}:
  type: upstream
  upstream: site:http
  cache:
    enabled: true
    cookies: []

https://www.{default}:
  type: redirect
  to: https://{default}

https://{default}/apps:
  type: upstream
  upstream: apps-backend:http
  cache:
    enabled: false
    cookies: ['session']

# The in-browser apps' files, built by apps-backend (see apps-backend/README.md).
https://{default}/browser-apps/generated:
  type: upstream
  upstream: apps-backend:http
  cache:
    enabled: true
    cookies: []
