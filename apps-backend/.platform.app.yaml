name: apps-backend

# Keep in sync with requires-python in pyproject.toml and the CI container.
type: "python:3.14"

disk: 3072

variables:
  env:
    APP_PATH: '/apps'
    # Use the image's Python rather than downloading one.
    UV_PYTHON_DOWNLOADS: 'never'
    # The uv cache is on a different filesystem from the app, so hardlinks fail.
    UV_LINK_MODE: 'copy'

web:
  commands:
    start: .venv/bin/python server.py

  locations:
    '/apps/static':
      root: 'app/static'
      allow: true
      passthru: '/404/index.html'
      expires: 1h

dependencies:
    python3:
       uv: '*'
    nodejs:
       pnpm: '*'

mounts:
  'download':
    source: local
    source_path: 'download'

  'resources/scores':
    source: local
    source_path: 'resources/scores'

  'app/templates/writable':
    source: local
    source_path: 'app/templates/writable'

  'wih-writable':
    source: local
    source_path: 'wih-writable'

relationships:
  site: "site:http"

build:
  flavor: none

hooks:
  build: |
    set -e

    cp When-in-Rome/Code/romanUmpire.py app/

    # Install the locked dependencies into .venv (see also .environment).
    UV_CACHE_DIR="$PLATFORM_CACHE_DIR/uv" uv sync --frozen --no-dev

    pnpm install --no-optional
    cp node_modules/opensheetmusicdisplay/build/opensheetmusicdisplay.min.js ./app/static/
  deploy: |
    set -e
    touch resources/scores/lieder.jsonl
    curl --max-time 5 -sS site.internal/template/index.html > app/templates/writable/base.html
  post_deploy: |
    cd app
    timeout 600 "$PLATFORM_APP_DIR/.venv/bin/python" -c 'from indexer import *; get_lieder_index("../When-in-Rome/Corpus/OpenScore-LiederCorpus", index_filename="../resources/scores/lieder.jsonl", rebuild=True)'
