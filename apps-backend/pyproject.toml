[project]
name = "apps-backend"
version = "0"
description = "Four Score and More apps: exercise generators and Working in Harmony"
# Keep in sync with `type` in .platform.app.yaml and the CI container.
requires-python = ">=3.14"
dependencies = [
    "flask",
    "flask-wtf",
    "gevent",
    "jsonlines",
    "music21~=10.5",
    "natsort",
    "werkzeug",
    "wtforms",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.uv]
# An application, not a library: install the dependencies only.
package = false

[tool.ruff]
# romanUmpire.py is copied from the When-in-Rome submodule at build time.
extend-exclude = ["When-in-Rome", "app/romanUmpire.py"]

[tool.ruff.lint]
# Errors only for now: syntax errors and undefined names.
# Widen this (e.g. to "E4", "E7", "E9", "F") once the existing code is cleaned up.
select = ["E9", "F63", "F7", "F82"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::music21.musicxml.xmlToM21.MusicXMLWarning"]
